version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
    groups:
      types:
        patterns:
          - '@types/*'
      dev-tooling:
        patterns:
          - '@biomejs/biome'
          - 'typescript'
          - 'vitest'
          - '@changesets/cli'
    cooldown:
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    labels:
      - 'dependencies'
